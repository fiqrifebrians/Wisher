<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisher - Collection View</title>
    <link rel="icon" href="assets/mini-logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    
    <!-- Sidebar Sinkronisasi Penuh di Halaman Collection -->
    <aside class="sidebar collapsed" id="sidebar">
        <div class="sidebar-toggle-btn" onclick="toggleSidebar()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <div class="brand">
            <h2 class="brand-text hide-on-collapse">Wisher<span class="dot highlight-dot">.</span></h2>
            <h2 class="brand-icon show-on-collapse">W<span class="dot highlight-dot">.</span></h2>
        </div>
        
        <div class="menu flex-grow hide-on-collapse" style="margin-top:20px;">
            <p class="menu-label" data-i18n="my_collections">My Collections</p>
            <ul id="sidebar-collections">
                <!-- Dynamically populated via JS for easy navigation -->
            </ul>
        </div>
        
        <div class="sidebar-profile">
            <div class="profile-trigger" onclick="UI.toggleProfileMenu()">
                <img src="https://ui-avatars.com/api/?name=User&background=dc2626&color=fff" id="profile-avatar" alt="Profile">
                <span id="display-username" class="profile-name hide-on-collapse">User</span>
            </div>
            <div class="profile-dropdown hide-on-collapse" id="profileDropdown">
                <button onclick="openMyAccount()" data-i18n="my_account">My Account</button>
                <button class="text-red" onclick="logout()" data-i18n="sign_out">Sign Out</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-nav">
            <div style="display:flex; justify-content:space-between; align-items:center; width: 100%;">
                <h1 id="current-collection-title">Loading Collection...</h1>
                
                <div style="display:flex; align-items:center; gap: 16px;">
                    <div class="custom-select-wrapper">
                        <select class="lang-select nav-btn" onchange="changeLang(this.value)">
                            <option value="en">🇬🇧 EN</option>
                            <option value="id">🇮🇩 ID</option>
                        </select>
                    </div>
                    <button class="secondary-btn" onclick="window.location.href='dashboard.html'" style="width: auto; padding: 10px 20px;" data-i18n="back">&larr; Back</button>
                </div>
            </div>
        </header>

        <div class="board-actions">
            <button class="primary-btn" onclick="openItemModal()" style="width: auto;" data-i18n="add_item">+ Add Item</button>
        </div>

        <div id="board-content" class="board-content">
            <!-- Dynamically populated Items -->
        </div>
    </main>

    <!-- Modal Form (Add / Edit Item) -->
    <div id="itemModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="itemModalTitle" data-i18n="add_item">Add Item</h3>
                <span class="close-btn" onclick="UI.closeModal('itemModal')">&times;</span>
            </div>
            <div class="modal-body">
                <p class="info-text" data-i18n="item_info">Paste a link to auto-generate, or fill manually.</p>
                
                <div class="input-group">
                    <label data-i18n="online_link">Online Link (URL)</label>
                    <input type="url" id="itemUrl" placeholder="https://store.com/product...">
                </div>

                <div class="input-group">
                    <label data-i18n="item_name">Item Name</label>
                    <input type="text" id="itemName" placeholder="Enter item name">
                </div>

                <div class="input-group">
                    <label data-i18n="image_source">Image Source</label>
                    <div style="display: flex; gap: 12px;">
                        <input type="url" id="itemImage" placeholder="Link Image URL" style="flex: 1;">
                        <input type="file" id="itemImageFile" accept="image/*" style="display:none;" onchange="previewItemImage(event)">
                        <button class="secondary-btn" onclick="document.getElementById('itemImageFile').click()" style="flex: 0 0 auto; width: auto; font-size:12px;" data-i18n="from_devices">From Devices</button>
                    </div>
                </div>
                <!-- Pratinjau 1:1 -->
                <img id="imagePreview" class="image-preview" src="" alt="Preview" style="display:none; width: 120px; border-radius: 12px; margin: 0 auto 16px; display: block; object-fit: cover; aspect-ratio: 1/1;">

                <div class="input-row">
                    <div class="input-group" style="flex: 0 0 110px;">
                        <label data-i18n="currency">Currency</label>
                        <select id="itemCurrency">
                            <option value="IDR">IDR (Rp)</option>
                            <option value="USD">USD ($)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="AUD">AUD ($)</option>
                            <option value="CNY">CNY (¥)</option>
                            <option value="JPY">JPY (¥)</option>
                            <option value="SGD">SGD ($)</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label data-i18n="price">Price</label>
                        <input type="number" id="itemPrice" placeholder="0">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="primary-btn" onclick="saveItem()" data-i18n="save_item">Save Item</button>
            </div>
        </div>
    </div>

    <!-- Modal Form (My Account) -->
    <div id="accountModal" class="modal-overlay">
        <!-- Kode Modal Akun tetap utuh sama persis seperti dashboard -->
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="my_account">My Account</h3>
                <span class="close-btn" onclick="UI.closeModal('accountModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="profile-upload-section" style="text-align:center; margin-bottom: 24px;">
                    <img id="accPreviewPic" src="https://ui-avatars.com/api/?name=User&background=dc2626&color=fff" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:12px; border: 2px solid var(--border-color);">
                    <input type="file" id="accProfilePhoto" accept="image/*" style="display:none;" onchange="UI.previewImage(event, 'accPreviewPic')">
                    <br>
                    <button class="secondary-btn" onclick="document.getElementById('accProfilePhoto').click()" style="padding:8px 16px; font-size:13px; width:auto;" data-i18n="upload_device">Upload from Devices</button>
                </div>
                <div class="input-group">
                    <label data-i18n="username">Username</label>
                    <input type="text" id="accUsername" disabled>
                </div>
                <div class="input-group">
                    <label data-i18n="email">Email</label>
                    <input type="email" id="accEmail">
                </div>
                <div class="edit-password-section">
                    <button class="secondary-btn" id="btnEditPassword" onclick="toggleEditPassword()" style="margin-bottom:8px;" data-i18n="edit_password">Edit Password</button>
                    <div id="passwordFields" style="display:none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
                        <div class="input-group">
                            <label data-i18n="old_password">Old Password</label>
                            <input type="password" id="accOldPassword">
                        </div>
                        <div class="input-group">
                            <label data-i18n="new_password">New Password</label>
                            <input type="password" id="accNewPassword" oninput="validateAccPassword()">
                            <p id="acc-error" class="error-text" data-i18n="pass_criteria">Password requires min 9 chars, 1 uppercase, 1 lowercase, 1 number.</p>
                        </div>
                        <div class="input-group">
                            <label data-i18n="confirm_new_password">Confirm New Password</label>
                            <input type="password" id="accConfirmPassword">
                        </div>
                        <div style="display:flex; justify-content: flex-end; margin-top: 12px;">
                            <button class="secondary-btn" onclick="cancelEditPassword()" style="width:auto; padding:8px 16px; font-size:13px;" data-i18n="cancel">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="primary-btn" onclick="saveAccount()" data-i18n="save_changes">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/ui-handler.js"></script>
    <script src="js/collection.js"></script>
</body>
</html>
