<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisher - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <h2 class="brand-text" style="color:var(--text-dark);">Wisher<span class="dot" style="color:var(--primary-red);">.</span></h2>
        </div>
        <div class="flex-grow"></div>
        
        <!-- Sidebar Profile with Dropdown -->
        <div class="sidebar-profile">
            <div class="profile-trigger" onclick="toggleProfileMenu()">
                <img src="https://ui-avatars.com/api/?name=User&background=ff3b30&color=fff" id="profile-avatar" alt="Profile">
                <span id="display-username" class="profile-name">User</span>
            </div>
            <div class="profile-dropdown" id="profileDropdown">
                <button onclick="openMyAccount()">My Account</button>
                <button class="text-red" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-nav">
            <h1 id="current-list-title">My Wishlist</h1>
            <div class="nav-actions">
                <select class="lang-select" onchange="changeLang(this.value)">
                    <option value="en">🇬🇧 EN</option>
                    <option value="id">🇮🇩 ID</option>
                </select>
            </div>
        </header>

        <!-- Tombol Aksi Utama di Konten -->
        <div class="board-actions">
            <button class="primary-btn" onclick="openCollectionModal()" style="width: auto;">+ Add New Collection</button>
        </div>

        <!-- Collections Area -->
        <div id="board-content" class="board-content">
            <!-- Dynamically populated Collections via JS -->
        </div>
    </main>

    <!-- Modal Form (Add Collection) -->
    <div id="collectionModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3>Add New Collection</h3>
                <span class="close-btn" onclick="closeModal('collectionModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Collection Name</label>
                    <input type="text" id="collectionName" placeholder="E.g., Dream Gadgets">
                </div>
            </div>
            <div class="modal-footer">
                <button class="primary-btn" onclick="saveCollection()">Save Collection</button>
            </div>
        </div>
    </div>

    <!-- Modal Form (My Account) -->
    <div id="accountModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>My Account</h3>
                <span class="close-btn" onclick="closeModal('accountModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="accUsername" disabled>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="accEmail">
                </div>
                
                <div class="edit-password-section">
                    <button class="secondary-btn" id="btnEditPassword" onclick="toggleEditPassword()" style="margin-bottom:16px;">Edit Password</button>
                    
                    <div id="passwordFields" style="display:none;">
                        <div class="input-group">
                            <label>Old Password</label>
                            <input type="password" id="accOldPassword">
                        </div>
                        <div class="input-group">
                            <label>New Password</label>
                            <input type="password" id="accNewPassword" oninput="validateAccPassword()">
                            <p id="acc-error" class="error-text">Password requires min 9 chars, 1 uppercase, 1 lowercase, 1 number.</p>
                        </div>
                        <div class="input-group">
                            <label>Confirm New Password</label>
                            <input type="password" id="accConfirmPassword">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="primary-btn" onclick="saveAccount()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
