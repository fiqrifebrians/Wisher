<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisher - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <h2 class="brand-text">Wisher<span class="dot">.</span></h2>
        </div>
        <button class="primary-btn new-list-btn" onclick="createNewWishlist()">+ New Wishlist</button>
        <div class="menu">
            <p class="menu-label">MY WISHLISTS</p>
            <ul id="wishlist-menu">
                <!-- Dynamically populated via JS -->
            </ul>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-nav">
            <h1 id="current-list-title">My Wishlist</h1>
            <div class="nav-actions">
                <select class="lang-select">
                    <option value="en">🇬🇧 EN</option>
                    <option value="id">🇮🇩 ID</option>
                </select>
                <div class="user-profile" onclick="logout()">
                    <img src="https://ui-avatars.com/api/?name=User&background=ff3b30&color=fff" alt="Profile" title="Click to Logout">
                </div>
            </div>
        </header>

        <div id="board-actions-container" class="board-actions" style="display:none;">
            <!-- SWAPPED POSITION: Add Category on the left, Add Item on the right -->
            <button class="secondary-btn" onclick="addCategory()">+ Add Category</button>
            <button class="secondary-btn" onclick="openModal()">+ Add Item</button>
        </div>

        <!-- Categories and Items Render Area -->
        <div id="board-content" class="board-content">
            <!-- Empty state or dynamically populated via JS -->
        </div>
    </main>

    <!-- Modal Form (Input Item Logic) -->
    <div id="itemModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add / Edit Item</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p class="info-text">Paste a link to auto-generate, or fill manually.</p>
                
                <div class="input-group">
                    <label>Online Link (URL)</label>
                    <input type="url" id="itemUrl" placeholder="https://store.com/product...">
                </div>

                <div class="input-group">
                    <label>Item Name</label>
                    <input type="text" id="itemName" placeholder="Enter item name">
                </div>

                <div class="input-group">
                    <label>Image URL (Customizable)</label>
                    <input type="url" id="itemImage" placeholder="https://image-link.com/photo.jpg">
                </div>
                <img id="imagePreview" class="image-preview" src="" alt="Preview" style="display:none;">

                <div class="input-row">
                    <div class="input-group">
                        <label>Currency</label>
                        <select id="itemCurrency">
                            <option value="IDR">IDR</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex: 2;">
                        <label>Price</label>
                        <input type="number" id="itemPrice" placeholder="0">
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Category</label>
                    <select id="itemCategory">
                        <option value="uncategorized">Uncategorized</option>
                        <!-- Dynamic Categories here -->
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="primary-btn" onclick="saveItem()">Save Item</button>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
