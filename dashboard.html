<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisher - Dashboard</title>
    <!-- Favicon Configuration -->
    <link rel="icon" href="assets/wisher-logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar">
        <!-- Toggle Button -->
        <div class="sidebar-toggle-btn" onclick="toggleSidebar()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>

        <div class="brand">
            <h2 class="brand-text hide-on-collapse" style="color:var(--text-dark);">Wisher<span class="dot highlight-dot" style="color:var(--primary-red) !important;">.</span></h2>
            <h2 class="brand-icon show-on-collapse" style="color:var(--primary-red); display:none;">W.</h2>
        </div>
        
        <div class="sidebar-actions hide-on-collapse" style="margin-bottom: 24px;">
            <button class="primary-btn" onclick="openCollectionModal()" data-i18n="add_collection">+ Add Collection</button>
        </div>

        <!-- Collections Menu -->
        <div class="menu flex-grow hide-on-collapse">
            <p class="menu-label" data-i18n="my_collections">MY COLLECTIONS</p>
            <ul id="sidebar-collections">
                <!-- Dynamically populated via JS -->
            </ul>
        </div>
        
        <!-- Sidebar Profile -->
        <div class="sidebar-profile">
            <div class="profile-trigger" onclick="toggleProfileMenu()">
                <img src="https://ui-avatars.com/api/?name=User&background=ff3b30&color=fff" id="profile-avatar" alt="Profile">
                <span id="display-username" class="profile-name hide-on-collapse">User</span>
            </div>
            <div class="profile-dropdown hide-on-collapse" id="profileDropdown">
                <button onclick="openMyAccount()" data-i18n="my_account">My Account</button>
                <button class="text-red" onclick="logout()" data-i18n="sign_out">Sign Out</button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-nav">
            <div style="display:flex; align-items:center; gap: 16px;">
                <h1 id="current-list-title" data-i18n="my_collections">My Collections</h1>
            </div>
            <div class="nav-actions">
                <div class="custom-select-wrapper compact">
                    <select class="lang-select compact" onchange="changeLang(this.value)" style="border-color: var(--text-gray); color: var(--text-dark);">
                        <option value="en">🇬🇧 EN</option>
                        <option value="id">🇮🇩 ID</option>
                    </select>
                </div>
            </div>
        </header>

        <div class="board-actions">
            <button class="primary-btn" onclick="openCollectionModal()" style="width: auto;" data-i18n="add_collection">+ Add Collection</button>
        </div>

        <!-- Render Area -->
        <div id="board-content" class="board-content">
            <!-- Dynamically populated Collections -->
        </div>
    </main>

    <!-- Modal Form (Collection) -->
    <div id="collectionModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 id="collectionModalTitle" data-i18n="add_collection">Add Collection</h3>
                <span class="close-btn" onclick="closeModal('collectionModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label data-i18n="collection_name">Collection Name</label>
                    <input type="text" id="collectionName" placeholder="E.g., Dream Gadgets">
                </div>
            </div>
            <div class="modal-footer">
                <button class="primary-btn" onclick="saveCollection()" data-i18n="save_collection">Save Collection</button>
            </div>
        </div>
    </div>

    <!-- Modal Form (My Account) -->
    <div id="accountModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="my_account">My Account</h3>
                <span class="close-btn" onclick="closeModal('accountModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="profile-upload-section" style="text-align:center; margin-bottom: 24px;">
                    <img id="accPreviewPic" src="https://ui-avatars.com/api/?name=User&background=ff3b30&color=fff" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:12px; border: 2px solid var(--border-color);">
                    <input type="file" id="accProfilePhoto" accept="image/*" style="display:none;" onchange="UI.previewImage(event, 'accPreviewPic')">
                    <br>
                    <button class="secondary-btn" onclick="document.getElementById('accProfilePhoto').click()" style="padding:8px 16px; font-size:13px; width:auto;" data-i18n="upload_device">Upload from Devices</button>
                </div>
                <div class="input-group">
                    <label data-i18n="username">Username</label>
                    <input type="text" id="accUsername" disabled>
                </div>
                <div class="input-group">
                    <label data-i18n="email">Email</label>
                    <input type="email" id="accEmail">
                </div>
                <div class="edit-password-section">
                    <button class="secondary-btn" id="btnEditPassword" onclick="toggleEditPassword()" style="margin-bottom:8px;" data-i18n="edit_password">Edit Password</button>
                    <div id="passwordFields" style="display:none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
                        <div class="input-group">
                            <label data-i18n="old_password">Old Password</label>
                            <input type="password" id="accOldPassword">
                        </div>
                        <div class="input-group">
                            <label data-i18n="new_password">New Password</label>
                            <input type="password" id="accNewPassword" oninput="validateAccPassword()">
                            <p id="acc-error" class="error-text" data-i18n="pass_criteria">Password requires min 9 chars, 1 uppercase, 1 lowercase, 1 number.</p>
                        </div>
                        <div class="input-group">
                            <label data-i18n="confirm_new_password">Confirm New Password</label>
                            <input type="password" id="accConfirmPassword">
                        </div>
                        <div style="display:flex; justify-content: flex-end; margin-top: 12px;">
                            <button class="secondary-btn" onclick="cancelEditPassword()" style="width:auto; padding:8px 16px; font-size:13px;" data-i18n="cancel">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="primary-btn" onclick="saveAccount()" data-i18n="save_changes">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/ui-handler.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
