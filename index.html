<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisher - Your Personal Wishlist</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="landing-body">
    <nav class="navbar">
        <div class="brand">
            <h2 class="brand-text">Wisher<span class="dot">.</span></h2>
        </div>
        <div class="nav-actions">
            <select class="lang-select">
                <option value="en">🇬🇧 EN</option>
                <option value="id">🇮🇩 ID</option>
            </select>
            <a href="auth.html" class="secondary-btn login-nav-btn">Login</a>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Your Personal Wishlist, <br><span class="highlight">Simplified.</span></h1>
            <p>Curate, organize, and track everything you want in one beautiful, minimalist space.</p>
            <button class="primary-btn cta-btn" onclick="handleCta()">Add Wishlist</button>
        </div>
        <div class="hero-visual">
            <div class="mockup-card">
                <div class="mockup-img"></div>
                <div class="mockup-text">
                    <div class="line short"></div>
                    <div class="line long"></div>
                </div>
            </div>
            <div class="mockup-card float">
                <div class="mockup-img alt"></div>
                <div class="mockup-text">
                    <div class="line short"></div>
                    <div class="line long"></div>
                </div>
            </div>
        </div>
    </header>

    <script>
        function handleCta() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'auth.html';
            }
        }
    </script>
</body>
</html>
