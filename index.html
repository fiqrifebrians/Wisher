<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisher - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- Login Form -->
        <div id="login-form" class="auth-form active">
            <h2>Welcome to Wisher</h2>
            <p class="subtitle">Kelola wish-list Anda dengan mudah.</p>
            
            <button class="google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                Log In with Google
            </button>
            
            <div class="divider"><span>OR</span></div>
            
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Masukkan email Anda">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Masukkan password">
            </div>
            <button class="primary-btn" onclick="window.location.href='dashboard.html'">Log In</button>
            
            <p class="toggle-text">Belum punya akun? <span onclick="toggleAuth()">Sign Up di sini</span></p>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="auth-form">
            <h2>Bergabung dengan Wisher</h2>
            <p class="subtitle">Buat wish-list impian Anda hari ini.</p>
            
            <button class="google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                Sign Up with Google
            </button>
            
            <div class="divider"><span>OR</span></div>
            
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama Anda">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Masukkan email Anda">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Buat password">
            </div>
            <button class="primary-btn" onclick="window.location.href='dashboard.html'">Sign Up</button>
            
            <p class="toggle-text">Sudah punya akun? <span onclick="toggleAuth()">Log In di sini</span></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
