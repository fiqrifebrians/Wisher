<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisher - Your Personal Wishlist</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="landing-body">
    <!-- Penambahan class gradient-nav untuk estetika Silver-Orange-Silver -->
    <nav class="navbar main-navbar gradient-nav">
        <div class="brand">
            <h2 class="brand-text">Wisher<span class="dot highlight-dot">.</span></h2>
        </div>
        <div class="nav-actions">
            <!-- Penyelarasan ukuran compact tombol bahasa -->
            <div class="custom-select-wrapper compact">
                <select class="lang-select compact" onchange="changeLang(this.value)">
                    <option value="en">🇬🇧 EN</option>
                    <option value="id">🇮🇩 ID</option>
                </select>
            </div>
            <a href="auth.html" class="primary-btn login-nav-btn compact-btn" data-i18n="login">Log In</a>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1 id="hero-title" data-i18n="hero_title">Your Personal Wishlist, <br><span class="highlight">Simplified.</span></h1>
            <button class="primary-btn cta-btn" onclick="handleCta()" data-i18n="add_wishlist">Add Wishlist</button>
        </div>
        <div class="hero-visual">
            <div class="mockup-card">
                <div class="mockup-img"></div>
                <div class="mockup-text">
                    <div class="line short"></div>
                    <div class="line long"></div>
                </div>
            </div>
            <div class="mockup-card float">
                <div class="mockup-img alt"></div>
                <div class="mockup-text">
                    <div class="line short"></div>
                    <div class="line long"></div>
                </div>
            </div>
        </div>
    </header>

    <script>
        const i18nLanding = {
            en: {
                login: "Log In",
                hero_title: "Your Personal Wishlist, <br><span class='highlight'>Simplified.</span>",
                add_wishlist: "Add Wishlist"
            },
            id: {
                login: "Masuk",
                hero_title: "Wishlist Personal Anda, <br><span class='highlight'>Lebih Mudah.</span>",
                add_wishlist: "Tambah Wishlist"
            }
        };

        function changeLang(lang) {
            localStorage.setItem('wisher_lang', lang);
            document.querySelector('.lang-select').value = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nLanding[lang] && i18nLanding[lang][key]) {
                    el.innerHTML = i18nLanding[lang][key];
                }
            });
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('wisher_lang') || 'en';
            changeLang(savedLang);
        };

        function handleCta() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'auth.html';
            }
        }
    </script>
</body>
</html>
